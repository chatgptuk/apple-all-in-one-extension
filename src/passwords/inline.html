<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="inline.css">
  <link rel="stylesheet" href="apple-design.css">
  <title>Apple All-In-One</title>
</head>
<body class="secure-inline">
  <main id="card" class="card" aria-live="polite">
    <header class="header">
      <div class="brand-icon" aria-hidden="true">
        <img src="brand-icon.svg" width="32" height="32" alt="">
      </div>
      <div class="brand-copy">
        <div class="eyebrow">PASSWORDS &amp; PRIVACY</div>
        <div id="host" class="host">This Website</div>
      </div>
      <button id="close" class="icon-button" aria-label="Close">
        <svg viewBox="0 0 20 20"><path d="m5.8 5.8 8.4 8.4m0-8.4-8.4 8.4"/></svg>
      </button>
    </header>

    <section id="content" class="content"></section>
    <div id="status" class="status" hidden></div>
  </main>
  <script src="password-generator.js"></script>
  <script src="symbols.js"></script>
  <script src="inline.js"></script>
</body>
</html>
