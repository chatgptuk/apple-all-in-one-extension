<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="inline.css">
  <title>Apple All-In-One</title>
</head>
<body>
  <main id="card" class="card" aria-live="polite">
    <header class="header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.1 3.3a4.7 4.7 0 1 0 3.2 8.2l1.2 1.2v1.7h1.8v1.8h1.8v2.4h3v-3l-5.8-5.8a4.7 4.7 0 0 0-5.2-6.5Zm-.5 6.4a1.55 1.55 0 1 1 0-3.1 1.55 1.55 0 0 1 0 3.1Z"/><path d="M5.7 14.1h4.2l2.1 2.1h-6.3a1.7 1.7 0 0 0-1.7 1.7v.4l3.5 2.4a1.5 1.5 0 0 0 1.7 0l3.3-2.3h3.7v.1a3 3 0 0 1-3 3H5.7a3 3 0 0 1-3-3v-1.4a3 3 0 0 1 3-3Z" opacity=".9"/></svg>
      </div>
      <div class="brand-copy">
        <div class="eyebrow">PASSWORDS &amp; PRIVACY</div>
        <div id="host" class="host">This Website</div>
      </div>
      <button id="close" class="icon-button" aria-label="Close">
        <svg viewBox="0 0 20 20"><path d="m5.8 5.8 8.4 8.4m0-8.4-8.4 8.4"/></svg>
      </button>
    </header>

    <section id="content" class="content"></section>
    <div id="status" class="status" hidden></div>
  </main>
  <script src="password-generator.js"></script>
  <script src="inline.js"></script>
</body>
</html>
